name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Build web bundle
        run: bun run build:apk

      - name: Generate clean Android platform
        run: |
          rm -rf android
          bunx cap add android

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Patch Android WebView input focus
        run: node scripts/patch-android-webview-inputs.mjs

      - name: Verify Android input-safe build
        run: |
          ! grep -R "@capacitor/keyboard\|capacitor-keyboard" -n android || true
          ! grep -R '"captureInput"' -n android/app/src/main/assets/capacitor.config.json || (echo "captureInput must not be set" && exit 1)
          grep -R "adjustResize" -n android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: payment-tester-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
